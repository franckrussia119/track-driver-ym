<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Suivi de la Flotte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #0f2136; --bg2: #1f4e78; --surface: #ffffff; --border: #d9dee3;
    --text: #1c2530; --text-dim: #5b6672; --navy: #1f4e78; --red: #c0392b; --red-bg: #fbe6e3;
  }
  @media (prefers-color-scheme: dark) {
    :root { --surface: #1b232c; --border: #34404c; --text: #e7edf3; --text-dim: #9aa8b5; --red-bg: #3a1e1c; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: radial-gradient(circle at 20% 20%, var(--bg2) 0%, var(--bg1) 65%);
    padding: 20px;
  }
  .card {
    background: var(--surface); color: var(--text); width: 100%; max-width: 380px;
    border-radius: 16px; padding: 34px 28px; box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }
  .logo { font-size: 34px; text-align: center; margin-bottom: 6px; }
  h1 { font-size: 19px; text-align: center; margin: 0 0 4px 0; font-weight: 800; color: var(--navy); }
  p.sub { text-align: center; color: var(--text-dim); font-size: 13px; margin: 0 0 26px 0; }
  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-dim); margin: 16px 0 6px 0; }
  label:first-of-type { margin-top: 0; }
  input {
    width: 100%; padding: 12px 14px; border-radius: 9px; border: 1.5px solid var(--border);
    font-size: 16px; font-family: inherit; background: transparent; color: var(--text);
    transition: border-color .15s;
  }
  input:focus { outline: none; border-color: var(--navy); }
  button {
    width: 100%; margin-top: 24px; padding: 13px; border: none; border-radius: 9px;
    background: linear-gradient(135deg, #2f7cc9, #1f4e78); color: #fff; font-size: 15.5px;
    font-weight: 700; cursor: pointer; transition: transform .1s, opacity .15s;
  }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.6; cursor: default; }
  .error {
    margin-top: 16px; background: var(--red-bg); color: var(--red); border-radius: 8px;
    padding: 10px 12px; font-size: 13px; font-weight: 600; display: none;
  }
  .error.show { display: block; }
</style>
</head>
<body>
  <form class="card" id="login-form">
    <div class="logo">🚛</div>
    <h1>Suivi de la Flotte &amp; des Conteneurs</h1>
    <p class="sub">Connectez-vous pour continuer</p>

    <label for="username">Nom d'utilisateur</label>
    <input id="username" name="username" type="text" autocomplete="username" required autofocus>

    <label for="password">Mot de passe</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <button type="submit" id="submit-btn">Se connecter</button>
    <div class="error" id="error-box">Nom d'utilisateur ou mot de passe incorrect.</div>
  </form>

<script>
  const form = document.getElementById("login-form");
  const btn = document.getElementById("submit-btn");
  const errBox = document.getElementById("error-box");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errBox.classList.remove("show");
    btn.disabled = true;
    btn.textContent = "Connexion...";
    try {
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("username").value,
          password: document.getElementById("password").value,
        }),
      });
      if (res.ok) {
        window.location.href = "/";
      } else {
        const data = await res.json().catch(() => ({}));
        errBox.textContent = data.error || "Nom d'utilisateur ou mot de passe incorrect.";
        errBox.classList.add("show");
      }
    } catch (err) {
      errBox.textContent = "Impossible de contacter le serveur.";
      errBox.classList.add("show");
    } finally {
      btn.disabled = false;
      btn.textContent = "Se connecter";
    }
  });
</script>
</body>
</html>
